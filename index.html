
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1033">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول تناوبی هوشمند</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>⚛ جدول تناوبی هوشمند</h1>
    <p>دنیای شگفت‌انگیز عناصر شیمیایی</p>
  </header>
<div class="student-info">
  <p>طراحی و اجرا: ابوالفضل یزدانی</p>
  <p>کلاس: دهم تجربی الف</p>
</div>
  <main class="container">

    <input
      type="text"
      id="search"
      placeholder="نام یا نماد عنصر را جستجو کنید..."
    >

    <section class="content">

  <div class="elements-wrapper">
    <div class="elements" id="elements"></div>
  </div>

<div class="legend">
  <div class="legend-item"><span class="legend-color alkali"></span> فلزات قلیایی</div>
  <div class="legend-item"><span class="legend-color alkaline"></span> فلزات قلیایی خاکی</div>
  <div class="legend-item"><span class="legend-color transition"></span> فلزات واسطه</div>
  <div class="legend-item"><span class="legend-color post-transition"></span> فلزات پس‌واسطه</div>
  <div class="legend-item"><span class="legend-color metalloid"></span> شبه‌فلزها</div>
  <div class="legend-item"><span class="legend-color nonmetal"></span> نافلزها</div>
  <div class="legend-item"><span class="legend-color halogen"></span> هالوژن‌ها</div>
  <div class="legend-item"><span class="legend-color noble-gas"></span> گازهای نجیب</div>
  <div class="legend-item"><span class="legend-color lanthanide"></span> لانتانیدها</div>
  <div class="legend-item"><span class="legend-color actinide"></span> اکتینیدها</div>
</div>


  <div class="details" id="details">

    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
